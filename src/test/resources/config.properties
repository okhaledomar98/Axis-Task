# ====================================================
# Tealium Automation Framework - Configuration
# ====================================================

# -------- Application URLs --------
base.url=https://ecommerce.tealiumdemo.com
login.url=https://ecommerce.tealiumdemo.com/customer/account/login/
register.url=https://ecommerce.tealiumdemo.com/customer/account/create/

# -------- Browser Settings --------
browser=chrome
headless=false
maximize.window=true

# -------- Timeouts (in seconds) --------
implicit.wait=0
explicit.wait=10
page.load.timeout=30

# -------- Test Data Paths --------
test.data.users=testdata/users.json
test.data.products=testdata/products.json

# -------- Screenshots --------
screenshots.path=screenshots/
screenshots.on.failure=true